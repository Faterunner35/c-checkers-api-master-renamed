name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          - name: Windows MSVC 2022
            os: windows-2022
            cmake_args: -G "Visual Studio 17 2022" -A x64

    steps:
      - uses: actions/checkout@v4

      # GoogleTest is not installed on the runners; test/CMakeLists.txt
      # fetches googletest v1.14.0 with FetchContent in that case.
      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
